<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini Notebook 完整介紹</title>
<style>
:root{--paper:#ebe2cf;--ink:#1f1c17;--muted:#5b5346;--red:#d23a2c;--yellow:#f6d648;--blue:#3567d6;--green:#2f8f5b;--card:#fbf8f1}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:#2a2620;color:#f4efe4;font-family:LessonSans,"Noto Sans TC","Microsoft JhengHei",sans-serif}
button,select{font:inherit;background:#3a342b;color:#f7f1e3;border:1px solid #6b604f;border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{background:#4a4237}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow)}
#shell{margin:auto;max-width:1400px;padding:20px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header.top h2{margin:0;font-family:LessonSerif,serif;font-size:28px}header.top span{color:#c9bca3;font-size:14px}
#viewport{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 20px 70px #0008}
#stage{position:relative;transform-origin:top left;overflow:hidden;background:var(--paper);color:var(--ink)}
#texture{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
.tape{position:absolute;left:96px;top:46px;background:var(--red);color:#fff;font-size:26px;font-weight:700;letter-spacing:4px;padding:6px 22px;transform:rotate(-2deg);box-shadow:2px 3px 0 #0002;white-space:nowrap}
#heading{position:absolute;left:96px;top:104px;width:1728px;height:100px;margin:0;font-family:LessonSerif,"Noto Serif TC",serif;font-weight:900;font-size:72px;line-height:1.3;letter-spacing:2px;white-space:nowrap;overflow:hidden}
#subheading{position:absolute;left:100px;top:206px;width:1724px;height:44px;margin:0;font-size:32px;line-height:1.3;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden}
#steps{position:absolute;right:96px;top:118px;display:none;gap:14px}
#steps span{font-size:28px;font-weight:700;padding:8px 18px;border:3px solid var(--ink);background:#fff8;transform:rotate(-1deg)}
#steps span.on{background:var(--ink);color:var(--paper)}
#visual{position:absolute;left:96px;top:262px;width:1728px;height:610px}
#diagram{display:block;width:100%;height:100%;overflow:hidden}
#credit{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
#creditCard{background:#fbf7ee;padding:56px 120px;transform:rotate(-1.5deg);box-shadow:6px 10px 24px #2b1f0c44;text-align:center}
#creditCard small{display:block;font-size:30px;letter-spacing:10px;color:var(--red);font-weight:700;margin-bottom:18px}
#creditCard strong{font-family:LessonSerif,serif;font-size:96px;letter-spacing:14px}
#caption{position:absolute;left:7%;bottom:30px;width:86%;min-height:150px;z-index:3;background:#1d1a15ee;color:#fbf4e4;border-radius:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:12px 28px;text-align:center;line-height:1.3}
#caption1{font-size:44px;font-weight:600}
#caption2{font-size:34px;color:#e7dcc4;font-family:LessonLatin,LessonSans,sans-serif}
#caption2:lang(ja){font-family:"Yu Gothic","YuGothic","Meiryo",LessonSans,sans-serif;font-weight:600}
#progress-mark{position:absolute;left:0;bottom:0;height:6px;background:var(--red)}
#controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 0}
#seek{flex:1;min-width:160px}#time{font-variant-numeric:tabular-nums;color:#d8ccb4}
.panel{margin-top:6px;padding:16px 18px;border:1px solid #6b604f;border-radius:12px;background:#352f27}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button[aria-selected="true"]{background:var(--yellow);color:#1f1c17;border-color:var(--yellow)}
.pane{display:none}.pane.on{display:block}
.pane p{margin:8px 0;line-height:1.6}.pane b{color:var(--yellow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.feedback{color:#f4e3b0;min-height:1.6em}
.quiz-q{margin:14px 0 6px;font-weight:700}.quiz-q+div button{margin:4px 6px 4px 0}
.ok{color:#9be3a8}.no{color:#ffb4a8}
.note{font-size:13px;color:#b9ad97;line-height:1.6}
body.export #shell{padding:0;max-width:none}body.export #viewport{border-radius:0;box-shadow:none}
body.export header.top,body.export #controls,body.export .panel,body.export .note{display:none}
@media (max-width:640px){#shell{padding:10px}header.top h2{font-size:22px}}
</style>

<header class="top"><h2>Gemini Notebook（原 NotebookLM）完整介紹</h2><span>資料截至 2026-10-17・李振偉老師</span></header>
<div id="viewport"><main id="stage" aria-label="教學動畫畫面">

<svg id="diagram" viewBox="0 0 1728 610" aria-label="教學動畫">

  <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="4" dy="7" stdDeviation="6" flood-color="#2b1f0c" flood-opacity=".28"/></filter>

</svg></div>
<div id="credit" data-qa data-container="#stage"><div id="creditCard"><small>感謝觀看</small><strong>李振偉老師</strong></div></div>
<div id="caption" data-qa data-container="#stage"><div id="caption1" lang="zh-Hant"></div><div id="caption2"></div></div>
<div id="progress-mark"></div>
</main></div>
<nav id="controls" aria-label="播放控制">
 <button id="play">播放</button><button id="replay">重播</button>
 <input id="seek" type="range" min="0" step="1" value="0" aria-label="播放進度"><span id="time"></span>
 <select id="locale" aria-label="配音語言"><option value="zh-TW">中文配音</option><option value="en-US">英文配音</option></select>
 <select id="subs" aria-label="字幕語言"><option value="en-US">中＋英字幕</option><option value="vi-VN">中＋越字幕</option><option value="ja-JP">中＋日字幕</option></select>
 <select id="chapters" aria-label="章節"></select><button id="captions" aria-pressed="true">字幕開啟</button>
</nav>
<section class="panel" aria-label="教學互動">
 <div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-pane="p-cite">① 引用回溯</button>
  <button role="tab" aria-selected="false" data-pane="p-pick">② 我該用哪個 Studio 產出？</button>
  <button role="tab" aria-selected="false" data-pane="p-quiz">③ 小測驗</button>
 </div>
 <div class="pane on" id="p-cite">
  <p>在原理章節的答案卡上，有兩個<b>引用編號</b>。點一下，看這句話出自哪份來源（影片會跳到該畫面並標示）。</p>
  <div class="row"><button data-cite="1">引用 1</button><button data-cite="2">引用 2</button></div>
  <p class="feedback" id="citeFeedback" role="status"></p>
 </div>
 <div class="pane" id="p-pick">
  <p>選擇你的目標，看看推薦的 Studio 產出：</p>
  <div class="row"><select id="goal" aria-label="學習目標">
   <option value="">— 請選擇 —</option><option value="commute">通勤時用聽的複習</option><option value="concept">一分鐘看懂一個難懂概念</option>
   <option value="exam">考前自我檢測</option><option value="overview">一眼看懂整體架構</option><option value="present">上課或報告要用的投影片</option><option value="numbers">整理多份文件裡的數字</option></select>
   <button id="goalJump" disabled>跳到相關畫面</button></div>
  <p class="feedback" id="goalFeedback" role="status"></p>
 </div>
 <div class="pane" id="p-quiz"><div id="quiz"></div><p class="feedback" id="quizScore" role="status"></p></div>
</section>
<p class="note">畫面為 Vox 式剪報拼貼的教學示意，不是產品真實介面。「示範」標示的案例為示範情境；比較依 2026-10 各家官方說明，非效能實測；展望中「測試中」「推測」皆已標示。配樂與音效為程式生成的原創素材。</p>
</div>

 opts.forEach((o,j)=>{const bt=document.createElement('button');bt.textContent=o;bt.onclick=()=>{if(row.dataset.done)return;row.dataset.done=1;answered++;if(j===ans){score++;fb.className='feedback ok';fb.textContent='✓ 答對了！'+exp}else{fb.className='feedback no';fb.textContent='✗ 再想想：'+exp}$('quizScore').textContent=`已作答 ${answered}/${QUIZ.length}，答對 ${score} 題`+(answered===QUIZ.length?(score>=4?'　很棒！':'　建議回看相關章節。'):'')};row.append(bt)});box.append(p,row,fb)})}
</script>
